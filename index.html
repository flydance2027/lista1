<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista M3U - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo-icon { font-size: 35px; color: #3b82f6; margin-bottom: 12px; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #ffffff; }
        p { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.4; }
        
        /* Contenedor donde aparecerá el anuncio de Monetag */
        .ad-container {
            background: #1f2937;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #374151;
        }

        .action-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 600; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .action-btn:hover { background: linear-gradient(135deg, #2563eb 100%, #1d4ed8 100%); }

        #hidden-section { display: none; margin-top: 20px; animation: fadeIn 0.4s ease-in-out; }
        .m3u-input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 10px; padding: 10px 15px; color: #d1d5db; font-size: 13px; outline: none; text-align: center; margin-bottom: 10px; }
        .copy-btn { background: #10b981; color: white; border: none; border-radius: 10px; padding: 10px; width: 100%; font-weight: 600; cursor: pointer; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        #toast { visibility: hidden; background-color: #10b981; color: white; text-align: center; border-radius: 8px; padding: 10px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 14px; z-index: 1000; opacity: 0; transition: 0.3s; }
        #toast.show { visibility: visibility; opacity: 1; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-icon"><i class="fa-solid fa-satellite-dish"></i></div>
        <h1>Lista M3U Oficial</h1>
        <p>Visualiza el contenido patrocinado y haz clic en el anuncio para desbloquear tu enlace.</p>

        <!-- ESPACIO DEL ANUNCIO DE MONETAG -->
        <div class="ad-container">
            <!-- AQUÍ PEGÁS EL CÓDIGO SCRIPT QUE TE DA MONETAG PARA TU BANNER/ZONA WEB -->
            <script type="text/javascript" src="https://tu-script-de-monetag.com/tag.min.js" data-zone="TU_ZONA"></script>
        </div>

        <!-- Botón para comprobar / desbloquear tras interactuar con el anuncio -->
        <button id="unlock-btn" class="action-btn" onclick="desbloquearEnlace()">
            <i class="fa-solid fa-check-circle"></i> Ya vi el anuncio / Desbloquear M3U
        </button>

        <!-- Sección oculta con el M3U -->
        <div id="hidden-section">
            <input type="text" id="m3uUrl" class="m3u-input" value="https://tu-proyecto.onrender.com/tu-lista.m3u" readonly>
            <button class="copy-btn" onclick="copiarLista()">
                <i class="fa-regular fa-copy"></i> Copiar Enlace M3U
            </button>
        </div>
    </div>

    <div id="toast"><i class="fa-solid fa-check"></i> ¡Enlace copiado!</div>

    <script>
        function desbloquearEnlace() {
            // Oculta el botón y muestra el link M3U para copiar
            document.getElementById('unlock-btn').style.display = 'none';
            document.getElementById('hidden-section').style.display = 'block';
        }

        function copiarLista() {
            const input = document.getElementById('m3uUrl');
            input.select();
            navigator.clipboard.writeText(input.value).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        }
    </script>

</body>
</html>
