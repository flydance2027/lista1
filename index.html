<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente | Sección en Construcción</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variables y Estilos Base */
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(18, 18, 23, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --purple-accent: #6d28d9;
            --cyan-accent: #06b6d4;
            --pink-accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            position: relative;
        }

        /* Luces de Fondo (Glowing Orbs) */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseOrb 6s ease-in-out infinite alternate;
        }

        .glow-orb-1 {
            width: clamp(250px, 40vw, 450px);
            height: clamp(250px, 40vw, 450px);
            background: radial-gradient(circle, rgba(109, 40, 217, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 10%;
            filter: blur(60px);
        }

        .glow-orb-2 {
            width: clamp(250px, 35vw, 400px);
            height: clamp(250px, 35vw, 400px);
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 10%;
            filter: blur(60px);
            animation-delay: -3s;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translateY(0); opacity: 0.8; }
            100% { transform: scale(1.1) translateY(-15px); opacity: 1; }
        }

        /* Header */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--purple-accent), var(--cyan-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .logo-text span {
            color: var(--cyan-accent);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(109, 40, 217, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--cyan-accent);
            margin-right: 0.5rem;
            box-shadow: 0 0 8px var(--cyan-accent);
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }

        /* Layout Principal */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1.25rem;
        }

        /* Tarjeta de Cristal (Glassmorphism) */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 620px;
            border-radius: 24px;
            padding: clamp(2rem, 5vw, 3.5rem) clamp(1.5rem, 4vw, 2.5rem);
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Icono Central */
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.75rem auto;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(109, 40, 217, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #a78bfa, var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Títulos y Párrafos */
        h1 {
            font-size: clamp(1.75rem, 5vw, 2.75rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .gradient-text {
            background: linear-gradient(135deg, #c084fc, var(--cyan-accent), var(--pink-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: var(--text-muted);
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            line-height: 1.6;
            max-width: 440px;
            margin: 0 auto 2rem auto;
            font-weight: 400;
        }

        /* Barra de Progreso */
        .progress-container {
            max-width: 440px;
            margin: 0 auto;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .progress-percentage {
            color: var(--cyan-accent);
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 9999px;
            padding: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 75%;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--purple-accent) 0%, var(--cyan-accent) 50%, var(--pink-accent) 100%);
            background-size: 200% 100%;
            animation: shimmerBar 3s infinite linear;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
        }

        @keyframes shimmerBar {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 12, 0.6);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .footer-content {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .copyright {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .social-links {
            display: flex;
            gap: 0.75rem;
        }

        .social-link {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            color: var(--cyan-accent);
            border-color: rgba(6, 182, 212, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Luces de Fondo (Glow Effets) -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- Header / Branding -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="logo-text">MI<span style="color: var(--cyan-accent);">MARCA</span></span>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            En desarrollo
        </div>
    </header>

    <!-- Contenido Principal -->
    <main>
        <div class="glass-card">
            
            <!-- Icono Decorativo -->
            <div class="icon-box">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>

            <!-- Título Principal -->
            <h1>
                Sección en <span class="gradient-text">Construcción</span>
            </h1>

            <!-- Descripción -->
            <p class="description">
                Estamos trabajando para ofrecerte una experiencia increíble. Esta sección estará disponible muy pronto.
            </p>

            <!-- Barra de Progreso -->
            <div class="progress-container">
                <div class="progress-header">
                    <span>Estado del proyecto</span>
                    <span class="progress-percentage">75% Completado</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p class="copyright">
                &copy; <span id="year"></span> Todos los derechos reservados.
            </p>
            <div class="social-links">
                <a href="#" class="social-link" aria-label="Twitter">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="#" class="social-link" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="#" class="social-link" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // Actualizar año dinámicamente
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
